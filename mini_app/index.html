<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Timestamp Selector</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Select Video Segment</h1>
        
        <div id="error-message" class="error" style="display: none;"></div>
        
        <div id="player-container"></div>
        
        <div class="controls">
            <div class="scrubber-container">
                <div class="scrubber-section">
                    <div class="scrubber-header">
                        <label class="scrubber-label">Video Timeline</label>
                        <span class="scrubber-time-display" id="fine-time">0:00.000</span>
                    </div>
                    <div class="stadiometer-container">
                        <div class="stadiometer-viewport" id="fine-scrubber-viewport">
                            <div class="stadiometer-scale" id="fine-scrubber-scale">
                                <!-- Tick marks and labels will be generated dynamically -->
                            </div>
                        </div>
                        <div class="stadiometer-indicator" id="fine-scrubber-indicator"></div>
                    </div>
                </div>
            </div>
            
            <div class="timestamp-display">
                <div class="timestamp-item">
                    <label>Start:</label>
                    <span id="start-time">Not set</span>
                    <button id="set-start-btn" class="btn btn-primary">Set as Start</button>
                </div>
                <div class="timestamp-item">
                    <label>End:</label>
                    <span id="end-time">Not set</span>
                    <button id="set-end-btn" class="btn btn-primary">Set as End</button>
                </div>
            </div>
            
            <div class="current-time">
                <span>Current: <span id="current-time">0:00</span></span>
            </div>
            
            <div class="download-mode-toggle">
                <label class="toggle-label">Download Mode:</label>
                <div class="toggle-switch">
                    <input type="radio" id="mode-video" name="download-mode" value="video" checked>
                    <label for="mode-video" class="toggle-option">Video</label>
                    <input type="radio" id="mode-audio" name="download-mode" value="audio">
                    <label for="mode-audio" class="toggle-option">Audio</label>
                </div>
            </div>
            
            <div class="action-buttons">
                <button id="confirm-btn" class="btn btn-success" disabled>Confirm & Download</button>
                <button id="reset-btn" class="btn btn-secondary">Reset</button>
            </div>
        </div>
    </div>
    
    <script src="player.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>

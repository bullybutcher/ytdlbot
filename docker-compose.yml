services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: ubuntu/mysql:8.0-22.04_beta
    restart: always
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=1
      - --max_allowed_packet=64M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ytdl:
    build: .
    # image: bennythink/ytdlbot  # Uncomment to use pre-built image instead of building
    env_file:
      - .env
    restart: always
    volumes:
      - ./youtube-cookies.txt:/app/youtube-cookies.txt:ro
      - ./proxy.json:/app/proxy.json:ro  # Proxy file (optional)
      - ./mini_app:/app/mini_app:ro  # Mini app static files
      - ./public_web:/app/public_web:ro  # Public web UI static files
    ports:
      - "8000:8000"  # Web server port (if ENABLE_WEB_SERVER=True)
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"] || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
